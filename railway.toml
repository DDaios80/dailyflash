# Railway configuration for the Daily Flash pipeline (cron job service).
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Railway dashboard → New Project → Deploy from GitHub repo.
#   3. Settings → set the cron schedule below (UI) or rely on this file.
#   4. Variables → paste env (see .env.example).
#
# Cron schedule: Railway cron is in UTC (NOT respecting TZ env var — confirmed
# via Railway UI showing "At HH:MM (UTC)" labels). Current setting is tuned for
# summer (EEST = UTC+3):
#   16:30 UTC = 19:30 Athens EEST (summer, April-October)
#             = 18:30 Athens EET  (winter, October-March  ← 1h off)
# Pipeline fires ~30 min before the 20:00 Athens email dispatcher so
# flash_reports is fresh for tomorrow's date.
#
# DST reminder — on the last Sunday of October (EEST→EET), bump this to
# "30 17 * * *" (= 17:30 UTC = 19:30 Athens EET). Reverse on the last
# Sunday of March.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -u src/cron.py"
cronSchedule = "30 16 * * *"
restartPolicyType = "NEVER"
