# Railway configuration for the Daily Flash pipeline (cron job service).
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. In Railway dashboard → New Project → Deploy from GitHub repo.
#   3. Settings → set the cron schedule below (UI) or rely on this file.
#   4. Variables → paste env (see .env.example).
#
# Cron schedule: 19:30 Athens (TZ=Europe/Athens env var pins this regardless of DST).
# Pipeline fires before the 20:00 email dispatcher so flash_reports is fresh for
# tomorrow when emails go out.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -u src/cron.py"
cronSchedule = "30 19 * * *"
restartPolicyType = "NEVER"
