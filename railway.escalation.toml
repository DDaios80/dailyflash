# Phase 55 — Railway config for the morning escalation cron service.
#
# Runs at 07:30 Europe/Athens (= 04:30 UTC summer / 05:30 UTC winter).
# Checks flash_email_approvals for today's report_date. If approved_at is
# null and rejected_at is null, calls send-flash-email with the
# escalation approver address (default d.daios@daioshotels.com,
# configurable via app_settings.flash_escalation_approver_email).
#
# HOW TO USE
# ──────────
# Same multi-service-from-one-repo pattern as railway.webhook.toml:
#
#   1. Railway project (helpful-patience) → New Service → "Empty Service"
#   2. Settings → Source → connect to DDaios80/dailyflash, branch: main
#   3. Settings → Config-as-code → set path to `railway.escalation.toml`
#   4. Variables → copy from dailyflash service:
#        SUPABASE_URL
#        SUPABASE_SERVICE_ROLE_KEY
#        PIPELINE_SECRET
#      Plus add SEND_FLASH_EMAIL_URL (copy from fortunate-mindfulness):
#        SEND_FLASH_EMAIL_URL=https://wgbghdbfmapuqbfeiygb.supabase.co/functions/v1/send-flash-email
#
# Schedule note: Railway cron is in UTC. 30 4 UTC = 07:30 Athens summer
# (EEST = UTC+3). On the last Sunday of October (EEST→EET), bump to
# "30 5 * * *" (= 07:30 Athens EET). Reverse on the last Sunday of March.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -u src/escalate_flash.py"
cronSchedule = "30 4 * * *"
restartPolicyType = "NEVER"
